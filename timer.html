<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Timer</title>
    <link rel="stylesheet" href="timer.css">
</head>
<body>

    <div class="timer-container">
        <h2>Pomodoro Timer</h2>
        <!-- This span updates dynamically via JavaScript -->
        <div class="time-display" id="display">25:00</div>
        <div id="session-label">Focus Time!</div>
        
        <div class="controls">
            <button class="start-btn" onclick="startTimer()">Start</button>
            <button class="stop-btn" onclick="stopTimer()">Stop</button>
            <button class="reset-btn" onclick="resetTimer()">Reset</button>
            <button class="mode-btn" onclick="toggleMode()">Switch to Break</button>
        </div>
    </div>

    <script>
        // Track core configuration values
        const STARTING_MINUTES = 25;
        const BREAK_MINUTES = 5;
        let timeInSeconds = STARTING_MINUTES * 60;
        let timerInterval = null;
        let isBreak = false;

        const displayElement = document.getElementById('display');
        const sessionLabel = document.getElementById('session-label');
        const modeButton = document.querySelector('.mode-btn');
        const bodyElement = document.body;

        function updateTheme() {
            bodyElement.classList.toggle('break-mode', isBreak);
            bodyElement.classList.toggle('focus-mode', !isBreak);
        }

        updateTheme();

        // Formats numbers less than 10 to always have a leading zero
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        // Main function to run the countdown logic
        function updateTimer() {
            if (timeInSeconds <= 0) {
                clearInterval(timerInterval);
                timerInterval = null;

                if (!isBreak) {
                    isBreak = true;
                    timeInSeconds = BREAK_MINUTES * 60;
                    sessionLabel.textContent = "Break Time!";
                    displayElement.textContent = formatTime(timeInSeconds);
                    updateTheme();
                    alert("25 minutes is up! Time for a 5-minute break.");
                    startTimer();
                } else {
                    isBreak = false;
                    timeInSeconds = STARTING_MINUTES * 60;
                    sessionLabel.textContent = "Focus Time!";
                    displayElement.textContent = formatTime(timeInSeconds);
                    updateTheme();
                    alert("Break is over! Back to work.");
                }
                return;
            }
            timeInSeconds--;
            displayElement.textContent = formatTime(timeInSeconds);
        }

        // Control logic for the buttons
        function startTimer() {
            // Prevent multiple intervals running at the same time
            if (timerInterval !== null) return; 
            
            sessionLabel.textContent = isBreak ? "Break Time!" : "Focus Time!";
            updateTheme();
            timerInterval = setInterval(updateTimer, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            timerInterval = null; // Clear tracking variable
        }

        function resetTimer() {
            stopTimer();
            isBreak = false;
            timeInSeconds = STARTING_MINUTES * 60;
            sessionLabel.textContent = "Focus Time!";
            displayElement.textContent = formatTime(timeInSeconds);
            updateTheme();
            modeButton.textContent = "Switch to Break";
        }

        function toggleMode() {
            stopTimer();
            isBreak = !isBreak;
            timeInSeconds = isBreak ? BREAK_MINUTES * 60 : STARTING_MINUTES * 60;
            sessionLabel.textContent = isBreak ? "Break Time!" : "Focus Time!";
            displayElement.textContent = formatTime(timeInSeconds);
            updateTheme();
            modeButton.textContent = isBreak ? "Switch to Focus" : "Switch to Break";
        }
    </script>

</body>
</html>
