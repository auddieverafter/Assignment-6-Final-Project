<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple HTML Timer</title>
    <style>
        /* Styles the background and center aligns content */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
        }
        /* Container box for the timer */
        .timer-container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        /* Style for the numbers display */
        .time-display {
            font-size: 4rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }
        /* Button styling */
        button {
            font-size: 1rem;
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }
        .start-btn { background-color: #28a745; color: white; }
        .stop-btn { background-color: #dc3545; color: white; }
        .reset-btn { background-color: #ffc107; color: #212529; }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <div class="timer-container">
        <h2>Countdown Timer</h2>
        <!-- This span updates dynamically via JavaScript -->
        <div class="time-display" id="display">05:00</div>
        
        <div class="controls">
            <button class="start-btn" onclick="startTimer()">Start</button>
            <button class="stop-btn" onclick="stopTimer()">Stop</button>
            <button class="reset-btn" onclick="resetTimer()">Reset</button>
        </div>
    </div>

    <script>
        // Track core configuration values
        const STARTING_MINUTES = 25;
        let timeInSeconds = STARTING_MINUTES * 60;
        let timerInterval = null;

        const displayElement = document.getElementById('display');

        // Formats numbers less than 10 to always have a leading zero
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        // Main function to run the countdown logic
        function updateTimer() {
            if (timeInSeconds <= 0) {
                clearInterval(timerInterval);
                displayElement.textContent = "00:00";
                alert("Time is up!");
                return;
            }
            timeInSeconds--;
            displayElement.textContent = formatTime(timeInSeconds);
        }

        // Control logic for the buttons
        function startTimer() {
            // Prevent multiple intervals running at the same time
            if (timerInterval !== null) return; 
            
            timerInterval = setInterval(updateTimer, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            timerInterval = null; // Clear tracking variable
        }

        function resetTimer() {
            stopTimer();
            timeInSeconds = STARTING_MINUTES * 60;
            displayElement.textContent = formatTime(timeInSeconds);
        }
    </script>

</body>
</html>
